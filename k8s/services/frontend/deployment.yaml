apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: innowise
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      initContainers:
        - name: wait-for-api-gateway
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z api-gateway 8083; do sleep 5; done']
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"